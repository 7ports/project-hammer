# fly.toml — Fly.io configuration for project-hammer-api
#
# SECRETS REQUIRED — set these before first deploy:
#   flyctl secrets set AISSTREAM_API_KEY=<your-key>
#   flyctl secrets set CORS_ORIGIN=https://<your-cloudfront-or-custom-domain>
#
# Never hardcode secrets in this file.

app            = "project-hammer-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# 3 GB persistent volume for SQLite storage (ais_positions, ferry_events, etc.).
# Create with: `fly volumes create hammer_data --size 3 --region yyz`.
# See .voltron/reports/ais-storage.md for the storage architecture.
# IMPORTANT: pinning to one machine — multi-machine writes to the same volume
# are not supported. `min_machines_running = 1` above already enforces this.
[mounts]
  source      = "hammer_data"
  destination = "/data"

[env]
  STORAGE_DB_PATH = "/data/hammer.db"

[checks]
  [checks.health]
    port     = 3001
    type     = "http"
    path     = "/api/health"
    interval = "30s"
    timeout  = "5s"
